<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ASL Web Chatbot — /api/chat Test UI</title>
<style>
  :root {
    --bg: #f4f6f8;
    --panel: #ffffff;
    --accent: #97144d;      /* Axis maroon */
    --accent-soft: #fce8f0;
    --bot-bubble: #eef1f4;
    --user-bubble: #97144d;
    --text: #1f2933;
    --muted: #7b8794;
    --border: #e1e6ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }

  /* ── Top-right password lock control ─────────────────────────────────── */
  #lockBox {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #lockBox input {
    width: 120px;
    padding: 6px 9px;
    border: none;
    border-radius: 7px;
    font-size: 12px;
    outline: none;
  }
  #lockBox button {
    padding: 6px 12px;
    border: none;
    border-radius: 7px;
    background: #fff;
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  #lockBox button:hover { background: var(--accent-soft); }
  #lockOk {
    display: none;
    color: #c8f7d4;
    font-size: 16px;
    font-weight: 700;
  }
  #lockErr {
    display: none;
    color: #c0143c;
    font-size: 12px;
    padding: 4px 16px 0;
  }

  /* ── Inline "Sources" citation (under a FAQ answer bubble) ───────────── */
  .citation {
    align-self: flex-start;
    max-width: 82%;
    margin-top: -4px;
    font-size: 12px;
  }
  .citation > summary {
    cursor: pointer;
    color: var(--accent);
    font-weight: 600;
    list-style: none;
    padding: 4px 2px;
    user-select: none;
  }
  .citation > summary::-webkit-details-marker { display: none; }
  .citation > summary::before { content: "📄 "; }
  .citation[open] > summary { margin-bottom: 6px; }
  .citation .sources-body {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .cite-chunk {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: #fafbfc;
  }
  .cite-chunk .chunk-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 10px;
    background: #eef1f4;
    font-size: 11px;
  }
  .cite-chunk .rank { font-weight: 700; color: var(--text); }
  .cite-chunk .score {
    font-weight: 700;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    color: #fff;
  }
  .cite-chunk .score.hi  { background: #1f9d55; }
  .cite-chunk .score.mid { background: #d9822b; }
  .cite-chunk .score.lo  { background: #c0143c; }
  .cite-chunk .src {
    font-size: 10px;
    color: var(--muted);
    padding: 4px 10px 0;
    word-break: break-all;
  }
  .cite-chunk .text {
    font-size: 11px;
    line-height: 1.5;
    color: var(--text);
    padding: 5px 10px 9px;
    white-space: pre-wrap;
    word-wrap: break-word;
    max-height: 180px;
    overflow-y: auto;
  }
  .app {
    width: 420px;
    max-width: 100%;
    height: 92vh;
    max-height: 760px;
    background: var(--panel);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px;
  }
  header .title { font-size: 15px; font-weight: 600; line-height: 1.2; }
  header .sub { font-size: 11px; opacity: 0.8; }

  .config {
    display: flex;
    gap: 8px;
    padding: 8px 12px;
    background: var(--accent-soft);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    align-items: center;
  }
  .config label { color: var(--muted); font-weight: 600; }
  .config input {
    flex: 1;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
  }
  .config button {
    border: 1px solid var(--accent);
    background: #fff;
    color: var(--accent);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .config button:hover { background: var(--accent); color: #fff; }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { max-width: 82%; padding: 10px 13px; border-radius: 14px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .msg.bot  { background: var(--bot-bubble); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: var(--user-bubble); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.meta { align-self: center; font-size: 11px; color: var(--muted); background: none; padding: 2px; }

  .quick-replies { display: flex; flex-wrap: wrap; gap: 6px; align-self: flex-start; max-width: 90%; }
  .quick-replies button {
    border: 1px solid var(--accent);
    background: #fff;
    color: var(--accent);
    border-radius: 16px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s;
  }
  .quick-replies button:hover { background: var(--accent); color: #fff; }

  /* Inline calendar range picker (shown for date-range flow states) */
  .date-picker {
    align-self: flex-start;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: 90%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .date-picker .row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .date-picker label { color: var(--muted); font-weight: 600; width: 42px; }
  .date-picker input[type="date"] {
    flex: 1; padding: 6px 8px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px; color: var(--text);
  }
  .date-picker .single .row label { width: auto; }
  .date-picker button {
    border: none; background: var(--accent); color: #fff;
    border-radius: 8px; padding: 8px 12px; font-size: 13px;
    font-weight: 600; cursor: pointer; margin-top: 4px;
  }
  .date-picker button:hover { background: #7b1030; }
  .date-picker .hint { font-size: 11px; color: var(--muted); }

  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 6px 10px; }

  footer {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
    background: #fff;
  }
  footer input {
    flex: 1;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 22px;
    font-size: 14px;
    outline: none;
  }
  footer input:focus { border-color: var(--accent); }
  footer button {
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 50%;
    width: 44px; height: 44px;
    cursor: pointer;
    font-size: 18px;
  }
  footer button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="avatar">AD</div>
    <div>
      <div class="title">Axis Direct Assistant</div>
      <div class="sub">Local in-process flows · /api/chat</div>
    </div>
    <!-- ── Top-right password lock (frontend-only; constant below) ────────── -->
    <div id="lockBox">
      <input id="lockPwd" type="password" placeholder="Password" autocomplete="off" />
      <button id="lockBtn">Unlock</button>
      <span id="lockOk" title="Unlocked">✓</span>
    </div>
  </header>
  <div id="lockErr"></div>

  <div class="config">
    <label for="clientId">Client ID</label>
    <input id="clientId" placeholder="Sub-Account ID (e.g. 12345678)" autocomplete="off" />
    <button id="resetBtn" title="Start a new conversation">New chat</button>
  </div>

  <div id="log"></div>

  <footer>
    <input id="input" placeholder="Type a message…" autocomplete="off" />
    <button id="sendBtn" title="Send">➤</button>
  </footer>
</div>

<script>
  // Hits the flows running in-process via /api/chat (local backend: python app.py).
  const API_URL = "http://localhost:8000/api/chat";
  // Local test UI: the dev Bearer token the backend expects (WEB_API_TOKEN).
  // The real Simcomm integration supplies its own token — this is for local
  // testing only. Identity comes from the Client ID field.
  const API_TOKEN = "asl_test!@";
  // Frontend-only password gate (client-side; change this value to set a new
  // password). This is NOT real security — it just gates the local test UI.
  const APP_PASSWORD = "axis@2026";

  const logEl = document.getElementById("log");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const resetBtn = document.getElementById("resetBtn");
  const clientIdEl = document.getElementById("clientId");
  let conversationId = newConvId();
  let lastQuickReplyTitles = [];

  function newConvId() {
    return "UI" + Math.random().toString(36).slice(2, 12).toUpperCase();
  }

  function addBubble(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
    return div;
  }

  function addMeta(text) { addBubble(text, "meta"); }

  function clearQuickReplies() {
    document.querySelectorAll(".quick-replies, .date-picker").forEach(e => e.remove());
  }

  function renderQuickReplies(options) {
    clearQuickReplies();
    if (!options || !options.length) { lastQuickReplyTitles = []; return; }
    lastQuickReplyTitles = options.map(o => o.title);
    const wrap = document.createElement("div");
    wrap.className = "quick-replies";
    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.textContent = opt.title;
      btn.onclick = () => send(opt.title, true);
      wrap.appendChild(btn);
    });
    logEl.appendChild(wrap);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // Flow states that should render a calendar picker instead of buttons.
  const RANGE_STATES  = ["date_range_30", "dp_date_selection", "order_date_selection"];
  const SINGLE_STATES = ["single_date"];

  function fmt(d) {
    // Date obj → DD-MM-YYYY
    const p = n => String(n).padStart(2, "0");
    return `${p(d.getDate())}-${p(d.getMonth() + 1)}-${p(d.getFullYear())}`;
  }
  function isoOffset(days) {
    const d = new Date(); d.setDate(d.getDate() + days);
    return d.toISOString().slice(0, 10); // YYYY-MM-DD for <input type=date>
  }

  function renderDatePicker(reference) {
    clearQuickReplies();
    lastQuickReplyTitles = [];
    const isRange = RANGE_STATES.includes(reference);
    const todayISO = isoOffset(0);
    const minISO   = isRange ? isoOffset(-30) : isoOffset(-3650);

    const box = document.createElement("div");
    box.className = "date-picker";

    if (isRange) {
      box.innerHTML =
        `<div class="row"><label>From</label><input type="date" id="dpFrom" min="${minISO}" max="${todayISO}" value="${isoOffset(-30)}"></div>` +
        `<div class="row"><label>To</label><input type="date" id="dpTo" min="${minISO}" max="${todayISO}" value="${todayISO}"></div>` +
        `<div class="hint">Select a range within the last 30 days.</div>` +
        `<button id="dpGo">Generate statement</button>`;
    } else {
      box.innerHTML =
        `<div class="row single"><label>Date</label><input type="date" id="dpFrom" min="${minISO}" max="${todayISO}" value="${todayISO}"></div>` +
        `<button id="dpGo">Continue</button>`;
    }
    logEl.appendChild(box);
    logEl.scrollTop = logEl.scrollHeight;

    box.querySelector("#dpGo").onclick = () => {
      const fromEl = box.querySelector("#dpFrom");
      const toEl   = box.querySelector("#dpTo");
      if (!fromEl.value) return;
      const from = fmt(new Date(fromEl.value + "T00:00:00"));
      if (isRange) {
        if (!toEl.value) return;
        const to = fmt(new Date(toEl.value + "T00:00:00"));
        send(`${from} to ${to}`, true);
      } else {
        send(from, true);
      }
    };
  }

  // ── Inline "Sources" citation (expandable, under a FAQ answer) ──────────
  function scoreClass(s) {
    if (s >= 0.6) return "hi";
    if (s >= 0.4) return "mid";
    return "lo";
  }

  function renderCitation(kb) {
    // kb = { query, top_score, chunks: [{score, source_uri, text}] }
    const chunks = (kb && kb.chunks) || [];
    if (!chunks.length) return;

    const det = document.createElement("details");
    det.className = "citation";

    const summary = document.createElement("summary");
    summary.textContent = "Sources (" + chunks.length + ")";
    det.appendChild(summary);

    const bodyWrap = document.createElement("div");
    bodyWrap.className = "sources-body";
    chunks.forEach((c, i) => {
      const score = Number(c.score || 0);
      const src = (c.source_uri || "").split("/").pop() || c.source_uri || "—";
      const card = document.createElement("div");
      card.className = "cite-chunk";
      card.innerHTML =
        '<div class="chunk-head">' +
          '<span class="rank">#' + (i + 1) + '</span>' +
          '<span class="score ' + scoreClass(score) + '">' + score.toFixed(3) + '</span>' +
        '</div>' +
        '<div class="src" title="' + escapeHtml(c.source_uri || "") + '">' + escapeHtml(src) + '</div>' +
        '<div class="text">' + escapeHtml(c.text || "") + '</div>';
      bodyWrap.appendChild(card);
    });
    det.appendChild(bodyWrap);

    logEl.appendChild(det);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "typing";
    div.id = "typing";
    div.textContent = "Assistant is typing…";
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function hideTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
  }

  async function send(message, isButtonTap) {
    message = (message || "").trim();
    if (!message) return;

    const isQuick = isButtonTap || lastQuickReplyTitles.includes(message);
    const event = isQuick ? "postback" : "Incoming message";

    clearQuickReplies();
    addBubble(message, "user");
    inputEl.value = "";
    sendBtn.disabled = true;
    showTyping();

    const body = {
      Conversationid: conversationId,
      Message: message,
      Event: event,
      Channel: "WEB",
      timestamp: new Date().toISOString(),
      Client_ID: clientIdEl.value,   // Sub-Account ID — identifies the customer
    };

    try {
      const headers = {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + API_TOKEN,
      };
      const resp = await fetch(API_URL, {
        method: "POST",
        headers: headers,
        body: JSON.stringify(body),
      });
      hideTyping();

      if (!resp.ok) {
        const errText = await resp.text();
        addBubble("⚠️ HTTP " + resp.status + ": " + errText +
          "\n\nIs app.py running (python app.py) and is the API token/creds valid?", "bot");
        return;
      }

      const data = await resp.json();
      const eventid = data.eventid || "?";

      if (eventid === "1002") {
        const summary = (data.context && data.context.summary) || "Escalated to a live agent.";
        addBubble("🔺 " + summary, "bot");
      } else {
        const reply = data.message || "(no message in response)";
        addBubble(reply, "bot");
        // FAQ answers carry their retrieved chunks — show them as an inline,
        // expandable "Sources" citation under the answer bubble.
        if (data.debug && data.debug.kb_retrieval) {
          renderCitation(data.debug.kb_retrieval);
        }
        // Quick replies: /api/chat (Simcomm) uses data.quickReplies.options[].
        const opts =
          (data.quickReplies && data.quickReplies.options) ||
          data.quick_replies ||
          [];
        // The backend sets quickReplies.reference = flow_state. For date-range
        // steps, render a calendar picker instead of quick-reply buttons.
        const reference =
          (data.quickReplies && data.quickReplies.reference) ||
          data.flow_state || "";
        if (RANGE_STATES.includes(reference) || SINGLE_STATES.includes(reference)) {
          renderDatePicker(reference);
        } else {
          renderQuickReplies(opts);
        }
      }

    } catch (err) {
      hideTyping();
      addBubble("⚠️ Request failed: " + err.message +
        "\n\nIs app.py running (python app.py) so the browser can reach /api/chat?", "bot");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  function resetChat() {
    logEl.innerHTML = "";           // also clears any inline citations
    conversationId = newConvId();
    clientIdEl.value = "";          // fresh conversation → clear Client ID (unauthenticated)
    lastQuickReplyTitles = [];
    addMeta("New conversation started. Type 'hi' to see the main menu.");
  }

  sendBtn.onclick = () => send(inputEl.value, false);
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter") send(inputEl.value, false);
  });
  resetBtn.onclick = resetChat;

  // ── Frontend-only password gate (top-right lock control) ────────────────
  const lockPwd = document.getElementById("lockPwd");
  const lockBtn = document.getElementById("lockBtn");
  const lockOk  = document.getElementById("lockOk");
  const lockErr = document.getElementById("lockErr");

  // Keep the chat disabled until unlocked.
  sendBtn.disabled = true;
  inputEl.disabled = true;

  function showLockErr(msg) {
    lockErr.textContent = msg || "";
    lockErr.style.display = msg ? "block" : "none";
  }

  function unlock() {
    const pwd = (lockPwd.value || "").trim();
    if (pwd !== APP_PASSWORD) {
      showLockErr("Invalid password. Try again.");
      lockPwd.focus();
      lockPwd.select();
      return;
    }
    showLockErr("");
    // Collapse the lock control into a ✓ and enable the chat.
    lockPwd.style.display = "none";
    lockBtn.style.display = "none";
    lockOk.style.display  = "inline";
    sendBtn.disabled = false;
    inputEl.disabled = false;
    addMeta("Set a Client ID (Sub-Account ID) above to identify the account, then type 'hi'.");
    inputEl.focus();
  }

  lockBtn.onclick = unlock;
  lockPwd.addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
  lockPwd.focus();
</script>
</body>
</html>
