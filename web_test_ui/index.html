<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ASL Web Chatbot — /api/chat Test UI</title>
<style>
  :root {
    --bg: #f4f6f8;
    --panel: #ffffff;
    --accent: #97144d;      /* Axis maroon */
    --accent-soft: #fce8f0;
    --bot-bubble: #eef1f4;
    --user-bubble: #97144d;
    --text: #1f2933;
    --muted: #7b8794;
    --border: #e1e6ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .app {
    width: 420px;
    max-width: 100%;
    height: 92vh;
    max-height: 760px;
    background: var(--panel);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: var(--accent);
    color: #fff;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px;
  }
  header .title { font-size: 15px; font-weight: 600; line-height: 1.2; }
  header .sub { font-size: 11px; opacity: 0.8; }

  .config {
    display: flex;
    gap: 8px;
    padding: 8px 12px;
    background: var(--accent-soft);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    align-items: center;
  }
  .config label { color: var(--muted); font-weight: 600; }
  .config input {
    flex: 1;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
  }
  .config button {
    border: 1px solid var(--accent);
    background: #fff;
    color: var(--accent);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  .config button:hover { background: var(--accent); color: #fff; }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { max-width: 82%; padding: 10px 13px; border-radius: 14px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
  .msg.bot  { background: var(--bot-bubble); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: var(--user-bubble); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.meta { align-self: center; font-size: 11px; color: var(--muted); background: none; padding: 2px; }

  .quick-replies { display: flex; flex-wrap: wrap; gap: 6px; align-self: flex-start; max-width: 90%; }
  .quick-replies button {
    border: 1px solid var(--accent);
    background: #fff;
    color: var(--accent);
    border-radius: 16px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s;
  }
  .quick-replies button:hover { background: var(--accent); color: #fff; }

  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 6px 10px; }

  footer {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
    background: #fff;
  }
  footer input {
    flex: 1;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 22px;
    font-size: 14px;
    outline: none;
  }
  footer input:focus { border-color: var(--accent); }
  footer button {
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 50%;
    width: 44px; height: 44px;
    cursor: pointer;
    font-size: 18px;
  }
  footer button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">AD</div>
    <div>
      <div class="title">Axis Direct Assistant</div>
      <div class="sub">Local test UI · POST /api/chat</div>
    </div>
  </header>

  <div class="config">
    <label>Bearer</label>
    <input id="token" value="asl_test!@" />
    <button id="resetBtn" title="Start a new conversation">New chat</button>
  </div>

  <div id="log"></div>

  <footer>
    <input id="input" placeholder="Type a message…" autocomplete="off" />
    <button id="sendBtn" title="Send">➤</button>
  </footer>
</div>

<script>
  const API_URL = "http://localhost:8000/api/chat";

  const logEl = document.getElementById("log");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const resetBtn = document.getElementById("resetBtn");
  const tokenEl = document.getElementById("token");

  let conversationId = newConvId();
  let lastQuickReplyTitles = [];

  function newConvId() {
    return "UI" + Math.random().toString(36).slice(2, 12).toUpperCase();
  }

  function addBubble(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
    return div;
  }

  function addMeta(text) { addBubble(text, "meta"); }

  function clearQuickReplies() {
    document.querySelectorAll(".quick-replies").forEach(e => e.remove());
  }

  function renderQuickReplies(options) {
    clearQuickReplies();
    if (!options || !options.length) { lastQuickReplyTitles = []; return; }
    lastQuickReplyTitles = options.map(o => o.title);
    const wrap = document.createElement("div");
    wrap.className = "quick-replies";
    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.textContent = opt.title;
      btn.onclick = () => send(opt.title, true);
      wrap.appendChild(btn);
    });
    logEl.appendChild(wrap);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "typing";
    div.id = "typing";
    div.textContent = "Assistant is typing…";
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function hideTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
  }

  async function send(message, isButtonTap) {
    message = (message || "").trim();
    if (!message) return;

    const isQuick = isButtonTap || lastQuickReplyTitles.includes(message);
    const event = isQuick ? "postback" : "Incoming message";

    clearQuickReplies();
    addBubble(message, "user");
    inputEl.value = "";
    sendBtn.disabled = true;
    showTyping();

    const body = {
      Conversationid: conversationId,
      Message: message,
      Event: event,
      Channel: "WEB",
      timestamp: new Date().toISOString(),
    };

    try {
      const resp = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + tokenEl.value.trim(),
        },
        body: JSON.stringify(body),
      });
      hideTyping();

      if (resp.status === 401) {
        addBubble("⚠️ 401 Unauthorized — check the Bearer token above (WEB_API_TOKEN).", "bot");
        return;
      }
      if (!resp.ok) {
        const errText = await resp.text();
        addBubble("⚠️ HTTP " + resp.status + ": " + errText, "bot");
        return;
      }

      const data = await resp.json();
      const eventid = data.eventid || "?";

      if (eventid === "1002") {
        const summary = (data.context && data.context.summary) || "Escalated to a live agent.";
        addBubble("🔺 " + summary, "bot");
        return;
      }

      const reply = data.message || "(no message in response)";
      addBubble(reply, "bot");
      renderQuickReplies(data.quickReplies && data.quickReplies.options);
    } catch (err) {
      hideTyping();
      addBubble("⚠️ Request failed: " + err.message +
        "\n\nIs the backend running?  cd chatbot_web && python app.py", "bot");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  function resetChat() {
    logEl.innerHTML = "";
    conversationId = newConvId();
    lastQuickReplyTitles = [];
    addMeta("New conversation started. Type 'hi' to see the main menu.");
  }

  sendBtn.onclick = () => send(inputEl.value, false);
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter") send(inputEl.value, false);
  });
  resetBtn.onclick = resetChat;

  addMeta("New conversation started. Type 'hi' to see the main menu.");
  inputEl.focus();
</script>
</body>
</html>
